name: Windows-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Install Ngrok via Chocolatey
      run: |
        choco install ngrok -y
    - name: Authenticate Ngrok
      run: ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
    - name: Set RDP Password
      run: |
        $Password = ConvertTo-SecureString "MySecretPassword123!" -AsPlainText -Force
        Set-LocalUser -Name "Administrator" -Password $Password
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
    - name: Create Tunnel
      run: Start-Process ngrok -ArgumentList "tcp 3389"
    - name: Show Connection Info
      run: |
        Start-Sleep -Seconds 5
        $NgrokApi = Invoke-RestMethod -Uri "http://127.0.0"
        $Url = $NgrokApi.tunnels.public_url
        Write-Host "=========================================="
        Write-Host "RDP Address: $Url"
        Write-Host "Username: Administrator"
        Write-Host "Password: passw0rd!"
        Write-Host "=========================================="
        Start-Sleep -Seconds 21600
