name: Windows-RDP

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Download Ngrok
      run: |
        Invoke-WebRequest https://equinox.io -OutFile ngrok.zip
        Expand-Archive ngrok.zip
    - name: Authenticate Ngrok
      run: .\ngrok\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
    - name: Create Tunnel
      run: Start-Process .\ngrok\ngrok.exe -ArgumentList "tcp 3389"
    - name: Show Connection Info
      run: |
        $NgrokApi = Invoke-RestMethod -Uri "http://127.0.0"
        $Url = $NgrokApi.tunnels.public_url
        Write-Host "=========================================="
        Write-Host "RDP Address: $Url"
        Write-Host "Username: Administrator"
        Write-Host "Password: (ใช้รหัสผ่านของบัญชี Windows บน Actions)"
        Write-Host "=========================================="
        Start-Sleep -Seconds 21600
        
